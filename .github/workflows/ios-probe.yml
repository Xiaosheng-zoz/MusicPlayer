name: iOS 探针

# 目的：在真实 macOS + iOS 模拟器上验证两件事
#   1. iOS 能不能读我们的 24bit / 96kHz FLAC（TagLibSharp）
#   2. iOS 能不能真的解码播放它（AVFoundation）—— 判据是播放位置推进，不是"文件被接受"
# 模拟器跑在 macOS 上，用的是和真机同一套 FLAC 解码器，所以不需要 iPhone / Apple ID / 签名。
#
# 探针刻意不用 MAUI：MAUI 的资源系统会调用 actool，而 CI 镜像上的 Xcode 26.6
# 调 actool 会失败（xcrun 那次查找调用返回 EINVAL）。不用 MAUI 就不碰 actool，
# 而 TagLib 与 AVFoundation 与技术结论无关，用最朴素的 UIKit 应用照样能验。

on:
  workflow_dispatch:
  push:
    paths:
      - 'spikes/IosProbe/**'      # .NET 版探针
      - 'spikes/FlacProbe/**'     # Swift 版探针（之前漏了，导致只改它时不触发）
      - '.github/workflows/ios-probe.yml'

jobs:
  probe:
    # 需要把日志推到 ci-logs 分支，供远程排查（作业日志下载要登录，读不到）
    permissions:
      contents: write

    # 必须用 macos-26：.NET 10 的 iOS SDK 是 26.5，要求 Xcode 26.6，
    # 而 macos-15 镜像只有 Xcode 16.4（第一次跑就是死在这里）。
    # macos-26 的默认 Xcode 正好是 26.6。
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: 安装 iOS 工作负载
        run: dotnet workload install ios

      - name: 选定 Xcode 并算出模拟器 RID
        run: |
          set -euo pipefail

          XCODE=$(ls -d /Applications/Xcode_26.6*.app 2>/dev/null | head -1 || true)
          if [ -z "$XCODE" ]; then
            echo "❌ 这个镜像里没有 Xcode 26.6。可用的有："
            ls -d /Applications/Xcode*.app || true
            echo "（.NET 10 的 iOS SDK 26.5 强制要求 Xcode 26.6）"
            exit 1
          fi
          sudo xcode-select -s "$XCODE"
          echo "已选用 $XCODE"

          # 不写死架构：镜像可能是 arm64 也可能是 x64
          if [ "$(uname -m)" = "arm64" ]; then
            RID=iossimulator-arm64
          else
            RID=iossimulator-x64
          fi
          echo "RID=$RID" >> "$GITHUB_ENV"

          echo "---------- 环境信息 ----------"
          dotnet --version
          xcodebuild -version
          uname -m
          echo "RID=$RID"
          xcrun simctl list runtimes

      - name: 准备 Xcode 工具链（首次初始化 + 缺组件补装）
        run: |
          set -uo pipefail

          echo "======================== 诊断开始 ========================"
          echo "--- xcode-select -p ---"
          xcode-select -p || true

          echo "--- 可用 SDK ---"
          xcodebuild -showsdks || true

          echo "--- Platforms 目录 ---"
          ls "$(xcode-select -p)/Platforms/" || true

          echo "--- 各 SDK 下找 actool ---"
          for sdk in iphonesimulator iphoneos macosx; do
            printf '%-16s -> ' "$sdk"
            xcrun --sdk "$sdk" --find actool 2>&1 || true
          done

          echo "--- 直接在 Xcode 目录里找 actool ---"
          find "$(xcode-select -p)/.." -name actool -maxdepth 6 2>/dev/null | head -10 || true
          echo "======================== 诊断结束 ========================"

          # 新选中的 Xcode 常常需要跑一次首次初始化，否则命令行工具不全
          echo "--- 执行 xcodebuild -runFirstLaunch ---"
          sudo xcodebuild -runFirstLaunch || echo "（runFirstLaunch 返回非零，继续）"

          # 如果 iOS 平台组件确实缺失，补下载
          if ! xcrun --sdk iphonesimulator --find actool >/dev/null 2>&1; then
            echo "--- actool 仍找不到，尝试补装 iOS 平台组件（可能要几分钟）---"
            sudo xcodebuild -downloadPlatform iOS || echo "（downloadPlatform 返回非零，继续）"
            xcodebuild -showsdks || true
          fi

          echo "--- 最终确认 ---"
          if xcrun --sdk iphonesimulator --find actool; then
            echo "✅ actool 可用，可以编译"
          else
            echo "❌ actool 仍然找不到。上面的诊断信息就是判断依据，别再往下走了。"
            exit 1
          fi

      - name: 编译探针（模拟器）
        run: |
          set -uo pipefail
          dotnet build spikes/IosProbe/IosProbe.csproj \
            -f net10.0-ios \
            -c Debug \
            -p:RuntimeIdentifier="$RID" 2>&1 | tee build.log
          status=${PIPESTATUS[0]}

          # 把编译输出的结尾发成 GitHub 注解。注解未登录也能通过 API 读到，
          # 而作业日志下载需要登录——这样排查就不用每次靠人工复制日志。
          #
          # 不按模式过滤：上一版用 grep 只匹配 error CSxxxx，结果一条都没中，
          # 因为失败未必是 C# 编译错误——工具链错误就是没有错误码的（形如 "error :"）。
          echo "--- 编译输出结尾 25 行 ---"
          tail -25 build.log
          while IFS= read -r line; do
            line=${line//'%'/'%25'}
            [ -n "$line" ] && echo "::error::${line}"
          done < <(tail -25 build.log)

          exit "$status"

      - name: 启动模拟器
        run: |
          set -euo pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r 'first(.devices[] | .[] | select(.name | test("iPhone")) | .udid)')
          if [ -z "$DEVICE_ID" ] || [ "$DEVICE_ID" = "null" ]; then
            echo "找不到可用的 iPhone 模拟器"; xcrun simctl list devices available; exit 1
          fi
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: 装进模拟器并运行探针
        run: |
          set -euo pipefail
          APP=$(find "spikes/IosProbe/bin/Debug/net10.0-ios/$RID" -maxdepth 1 -name '*.app' | head -1)
          if [ -z "$APP" ]; then
            echo "没找到 .app"; find spikes/IosProbe/bin -maxdepth 4 -name '*.app'; exit 1
          fi
          echo "APP=$APP"
          xcrun simctl install "$DEVICE_ID" "$APP"

          # --console-pty 会把应用的 stdout 回传到这个步骤的日志里。
          # 末尾的 || true 是有意的：探针失败时应用以非零码退出，别让它把步骤提前打断，
          # 结论统一由下面的 grep 判定。
          xcrun simctl launch --console-pty "$DEVICE_ID" com.xszoz.iosprobe 2>&1 | tee probe-output.txt || true

          echo "---------------- 探针输出 ----------------"
          cat probe-output.txt
          echo "------------------------------------------"

          if grep -q "结论: PASS" probe-output.txt; then
            echo "✅ 探针通过：iOS 能读也能播 24bit/96k FLAC"
          else
            echo "❌ 探针未通过，看上面的输出"
          fi

          # 同样把探针的关键结果发成注解，方便远程读取
          echo "--- 探针结果摘要 ---"
          grep -E '^\[|播放位置推进到|item\.Status|结论:' probe-output.txt | head -30 > summary.txt || true
          cat summary.txt
          while IFS= read -r line; do
            [ -n "$line" ] && echo "::notice::${line}"
          done < summary.txt

          grep -q "结论: PASS" probe-output.txt

      - name: 保存日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-output
          path: probe-output.txt
          if-no-files-found: warn

      # 作业日志的 API 下载需要登录（公开仓库也一样，403），
      # 所以把日志推到独立分支 ci-logs，用 contents 接口就能读到。
      # 推到独立分支是为了不污染 master；路径过滤也不匹配 .ci-logs，不会再触发构建。
      - name: 把日志推到 ci-logs 分支
        if: always()
        run: |
          set -uo pipefail
          mkdir -p .ci-logs
          cp build.log .ci-logs/build.log 2>/dev/null || echo "(没有 build.log)" > .ci-logs/build.log
          cp probe-output.txt .ci-logs/probe-output.txt 2>/dev/null || true
          {
            echo "run_number: ${{ github.run_number }}"
            echo "sha: $GITHUB_SHA"
            echo "RID: ${RID:-<未设置>}"
          } > .ci-logs/meta.txt

          # 把构建里失败的那条 xcrun 调用原样复现，结果写进文件供远程读取。
          # 构建报的是 xcrun 找不到工具（actool / install_name_tool），
          # 而普通步骤里的 xcrun 查找是成功的——差别一定在环境上。
          {
            XC=$(xcode-select -p)
            SDK="$XC/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
            echo "XCODE_DEV_DIR = $XC"
            echo "SDK 路径     = $SDK"
            ls -ld "$SDK" 2>&1 || echo "(该 SDK 路径不存在)"
            ls -l "$XC/Platforms/MacOSX.platform/Developer/SDKs/" 2>&1 || true

            echo ""
            echo "### 原样复现：xcodebuild -sdk <macosx> -find actool"
            "$XC/usr/bin/xcodebuild" -sdk "$SDK" -find actool 2>&1
            echo "exit=$?"

            echo ""
            echo "### 变体"
            xcrun --sdk macosx --find actool 2>&1;             echo "  exit=$?"
            xcrun -find actool 2>&1;                           echo "  exit=$?"
            xcrun --sdk iphonesimulator --find actool 2>&1;    echo "  exit=$?"
            xcrun --sdk iphoneos --find install_name_tool 2>&1; echo "  exit=$?"
            ls -l "$XC/usr/bin/actool" "$XC/usr/bin/install_name_tool" 2>&1 || true

            echo ""
            echo "### 环境"
            echo "DEVELOPER_DIR=${DEVELOPER_DIR:-<未设置>}"
            echo "PATH=$PATH"
            echo "xcode-select -p = $(xcode-select -p)"
          } > .ci-logs/xcode-diag.txt 2>&1

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs
          git add -f .ci-logs
          git commit -m "ci: 第 ${{ github.run_number }} 次构建日志"
          git push -f origin ci-logs

  # ==========================================================================
  # Swift 版探针：绕开 .NET 的 iOS 工具链，直接用 swiftc + AVFoundation
  # 回答"Apple 的音频栈能不能解码 24bit/96kHz FLAC"。
  # 同一个程序跑两遍：macOS 原生（同一套 CoreAudio）和 iOS 模拟器（真 iOS 运行时）。
  # 推到独立分支 ci-logs-swift，避免和上面的作业抢同一个分支。
  # ==========================================================================
  flac-probe:
    runs-on: macos-26
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: macOS 原生运行
        run: |
          set -uo pipefail
          echo "SWIFT: $(swift --version 2>&1 | head -2)"
          swiftc -O spikes/FlacProbe/main.swift -o flacprobe 2>&1 | tee swift-build-macos.log
          if [ -x ./flacprobe ]; then
            ./flacprobe spikes/IosProbe/Resources/Raw/sample-24bit96k.flac 2>&1 | tee flac-macos.txt
          else
            echo "(macOS 版没编译出来)" | tee flac-macos.txt
          fi

      - name: iOS 模拟器运行
        run: |
          set -uo pipefail
          APP=FlacProbe.app
          rm -rf "$APP" || true
          mkdir -p "$APP"
          cp spikes/FlacProbe/Info.plist "$APP/Info.plist"
          cp spikes/IosProbe/Resources/Raw/sample-24bit96k.flac "$APP/sample-24bit96k.flac"

          # 手工搓一个最小 .app：不需要 Xcode 工程，也就不碰 actool
          xcrun --sdk iphonesimulator swiftc \
            -target arm64-apple-ios16.0-simulator \
            -o "$APP/FlacProbe" \
            spikes/FlacProbe/main.swift \
            -framework AVFoundation -framework Foundation 2>&1 | tee swift-build-ios.log

          if [ ! -x "$APP/FlacProbe" ]; then
            echo "(iOS 版没编译出来，看 swift-build-ios.log)" | tee flac-ios.txt
            exit 0
          fi

          DEVICE_ID=$(xcrun simctl list devices available -j \
            | jq -r 'first(.devices[] | .[] | select(.name | test("iPhone")) | .udid)')
          echo "模拟器 = $DEVICE_ID"
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcrun simctl install "$DEVICE_ID" "$APP"
          xcrun simctl launch --console-pty "$DEVICE_ID" com.xszoz.flacprobe 2>&1 | tee flac-ios.txt || true

      - name: 推送结果到 ci-logs-swift
        if: always()
        run: |
          set -uo pipefail
          mkdir -p .ci-logs
          for f in flac-macos.txt flac-ios.txt swift-build-macos.log swift-build-ios.log; do
            cp "$f" ".ci-logs/$f" 2>/dev/null || echo "(没有 $f)" > ".ci-logs/$f"
          done
          echo "run_number: ${{ github.run_number }}" > .ci-logs/meta.txt
          echo "sha: $GITHUB_SHA" >> .ci-logs/meta.txt

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B ci-logs-swift
          git add -f .ci-logs
          git commit -m "ci: 第 ${{ github.run_number }} 次 FLAC 探针结果"
          git push -f origin ci-logs-swift
